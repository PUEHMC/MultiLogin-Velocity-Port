plugin_version=0.6.13
org.gradle.jvmargs=-Xmx1024m
# Target Velocity version (compile baseline). The matching official distribution jar is
# downloaded into libs/ on first use, then used as the compile-only dependency.
#
#   3.5.x  -> build with JDK 21+
#   4.x    -> MUST build with JDK 25 (Velocity 4 itself is Java 25 bytecode)
#
# You can override per build:  gradlew shadowJar -Pvelocity_version=4.3.1 -Penv=final
velocity_version=3.5.1
