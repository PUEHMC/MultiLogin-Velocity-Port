plugin_version=0.6.13
org.gradle.jvmargs=-Xmx1024m
# Target Velocity version. Change it and re-run `gradlew shadowJar` to switch the
# compile baseline; the official distribution jar is downloaded into libs/ on first use.
#   Velocity 3.5.x -> Java 21+ is enough
#   Velocity 4.x   -> must build & run on Java 25 (Velocity itself is Java 25 bytecode)
velocity_version=4.3.1
