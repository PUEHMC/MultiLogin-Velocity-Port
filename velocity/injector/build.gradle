plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven {
        name 'papermc'
        url 'https://repo.papermc.io/repository/maven-public/'
    }
    mavenCentral()
    maven { url = 'https://maven.elytrium.net/repo/' }
}


java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    compileOnly project(":api")
    compileOnly project(":core")
    compileOnly project(":velocity")

    // Velocity 本体（含 api / proxy / netty / adventure / guava 等）
    compileOnly files(rootProject.ext.velocityDistFile)
}

tasks.named('compileJava') {
    dependsOn rootProject.tasks.named('prepareVelocityDist')
}

shadowJar {
    archiveFileName = 'MultiLogin-Velocity-Injector.JarFile'
}

artifacts {
    archives shadowJar
}