pluginManagement {
    repositories {
        // 国内网络访问 plugins.gradle.org 很慢，优先走阿里云镜像
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'MultiLogin'

include 'api'
include 'core'
